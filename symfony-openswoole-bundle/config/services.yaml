parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\DbPool:
        arguments:
            # 16 workers x 10 native connections, plus DBAL and administration.
            $maxSize: 10
            $waitTimeout: 1.0
            $statementTimeoutMs: 5000
