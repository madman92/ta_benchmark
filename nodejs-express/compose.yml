services:

  app:
    build: .
    working_dir: /app
    command: node server.js
    ports:
      - "8090:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      WORKERS: 16
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: express
      DB_USER: express
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    command: postgres -c max_connections=500
    environment:
      POSTGRES_DB: express
      POSTGRES_USER: express
      POSTGRES_PASSWORD: secret
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U express"]
      interval: 3s
      timeout: 3s
      retries: 10