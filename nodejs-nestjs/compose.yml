services:

  app:
    build: .
    working_dir: /app
    command: node dist/main.js
    ports:
      - "8091:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      WORKERS: 16
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nest
      DB_USER: nest
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    command: postgres -c max_connections=500
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: secret
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nest -d nest"]
      interval: 3s
      timeout: 3s
      retries: 10
