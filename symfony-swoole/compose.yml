services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php public/index.php
    ports:
      - "8087:8080"
    environment:
      APP_RUNTIME: Runtime\Swoole\Runtime
      APP_RUNTIME_OPTIONS: '{"host":"0.0.0.0","port":8080,"settings":{"worker_num":16,"max_request":0}}'
      APP_ENV: prod
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: symfony
      DB_USER: symfony
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    command: postgres -c max_connections=500
    environment:
      POSTGRES_DB: symfony
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: secret
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U symfony -d symfony"]
      interval: 3s
      timeout: 3s
      retries: 10
