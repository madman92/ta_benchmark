services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php bin/console openswoole:server:start
    ports:
      - "8088:8080"
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: symfony
      DB_USER: symfony
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    # restart: unless-stopped
    # volumes:
    #   - ./:/app

  db:
    image: postgres:17-alpine
    command: postgres -c max_connections=500
    environment:
      POSTGRES_DB: symfony
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: secret
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symfony"]
      interval: 3s
      timeout: 3s
      retries: 10
