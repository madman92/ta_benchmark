services:

  app:
    build: .
    working_dir: /app
    command: node entry.js
    ports:
      - "8092:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      WORKERS: 16
      INTERNAL_BASE: 8100
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: next
      DB_USER: next
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    command: postgres -c max_connections=500
    environment:
      POSTGRES_DB: next
      POSTGRES_USER: next
      POSTGRES_PASSWORD: secret
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next"]
      interval: 3s
      timeout: 3s
      retries: 10