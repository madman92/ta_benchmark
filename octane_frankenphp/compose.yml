services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --workers=16 --max-requests=1000000000
    ports:
      - "8086:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      APP_URL: http://localhost:8086
      OCTANE_SERVER: frankenphp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    command: postgres -c max_connections=500
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U laravel -d laravel"]
      interval: 3s
      timeout: 3s
      retries: 10
